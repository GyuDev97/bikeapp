apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    namespace 'com.bike.trailgo'

    buildFeatures{
        viewBinding = true
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.bike.trailgo"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 3
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def trailgoServerBaseUrl = project.findProperty("TRAILGO_SERVER_BASE_URL") ?: "http://192.168.0.5:8000/"
        def gyuvisBaseUrl = project.findProperty("GYUVIS_BASE_URL") ?: ""
        def gyuvisApiToken = project.findProperty("GYUVIS_API_TOKEN") ?: ""
        def rideAssistantTestMode = project.findProperty("RIDE_ASSISTANT_TEST_MODE") ?: "false"
        buildConfigField "String", "TRAILGO_SERVER_BASE_URL", "\"${trailgoServerBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "GYUVIS_BASE_URL", "\"${gyuvisBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "String", "GYUVIS_API_TOKEN", "\"${gyuvisApiToken.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "boolean", "RIDE_ASSISTANT_TEST_MODE", rideAssistantTestMode
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0+'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.1.0'
    implementation 'androidx.navigation:navigation-ui:2.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation files('src/main/jniLibs/libDaumMapAndroid.jar')
    implementation 'com.github.PhilJay:MpAndroidChart:v3.0.1'
    implementation files('src/main/jniLibs/simple-xml-2.7.1.jar')
    implementation 'net.danlew:android.joda:2.9.9.3'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.kakao.maps.open:android:2.14.1'
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'commons-io:commons-io:2.6'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation group: 'com.squareup.retrofit2', name: 'converter-scalars', version: '2.3.0'


}
