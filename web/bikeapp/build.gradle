plugins {
	id 'org.springframework.boot' version '2.7.2'
	id 'io.spring.dependency-management' version '1.0.12.RELEASE'
	id 'java'
	id 'war'
}

group = 'com.bike.bikeapp'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'com.googlecode.json-simple:json-simple:1.1.1'
	implementation 'org.springframework.security:spring-security-web:5.7.2'
	implementation 'org.springframework.security:spring-security-config:5.7.2'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.13.3'
	implementation 'commons-io:commons-io:2.11.0'
	implementation 'com.oracle.database.jdbc:ojdbc8:21.7.0.0'
	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
	implementation group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '3.0.9'
	
}

tasks.named('test') {
	useJUnitPlatform()
}
	