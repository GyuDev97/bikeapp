#settings
spring.datasource.driverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.thymeleaf.prefix=classpath:templates/
spring.thymeleaf.check-template-location=true
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.cache=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=info

trailgo.admin.username=${TRAILGO_ADMIN_USERNAME:}
trailgo.admin.password-hash=${TRAILGO_ADMIN_PASSWORD_HASH:}
trailgo.maps.kakao-app-key=${TRAILGO_KAKAO_MAPS_APP_KEY:}
trailgo.android-download-url=${TRAILGO_ANDROID_DOWNLOAD_URL:}
trailgo.support-email=bgpoilkj@naver.com

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
server.port = 8002
trailgo.storage-root=${TRAILGO_STORAGE_ROOT:${user.dir}/data}
