#settings
spring.datasource.driverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=${DB_URL:jdbc:log4jdbc:mariadb://localhost:3306/mtbcraft}
spring.datasource.username=${DB_USERNAME:bglee}
spring.datasource.password=${DB_PASSWORD:bglee97}


spring.thymeleaf.prefix=classpath:templates/
spring.thymeleaf.check-template-location=true
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.cache=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=info

trailgo.admin.username=${TRAILGO_ADMIN_USERNAME:admin}
trailgo.admin.password=${TRAILGO_ADMIN_PASSWORD:1234}
trailgo.maps.kakao-app-key=20102273a3ad3a2b6e9c1eba8f18f55c
trailgo.android-download-url=${TRAILGO_ANDROID_DOWNLOAD_URL:https://play.google.com/store/apps/details?id=com.bike.trailgo}
trailgo.support-email=bgpoilkj@naver.com

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
server.port = 8002
trailgo.storage-root=${TRAILGO_STORAGE_ROOT:${user.dir}/data}

# Weather snapshot for rides. The KMA key is injected from the server environment only: never commit it.
trailgo.weather.kma-service-key=${KMA_SERVICE_KEY:282076ab846e1e68adae0c34c6b503530066bab25a11556fd8b34f6d9db05bf3}

# Riding photos: largest accepted upload in bytes (the app sends ~1 MB compressed JPEGs).
trailgo.photo.max-bytes=${TRAILGO_PHOTO_MAX_BYTES:8388608}
