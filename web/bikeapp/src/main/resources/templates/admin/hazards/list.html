<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>위험지역 관리 | TrailGO 관리자</title><link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-page" th:attr="data-kakao-key=${kakaoMapAppKey}">
  <div th:replace="admin/fragments/sidebar :: sidebar"></div>
  <div class="admin-main">
    <div th:replace="admin/fragments/header :: header('위험지역 관리')"></div>
    <main class="admin-content wide-content">
      <div class="page-title"><div><h1>위험지역 관리</h1><p>사용자가 제보한 위험지역을 검토하고 관리합니다.</p></div></div>
      <section class="stats-grid compact-stats" aria-label="위험지역 통계">
        <article><span class="stat-icon neutral">Σ</span><small>전체 제보</small><strong th:text="${stats.total}">0</strong></article>
        <article><span class="stat-icon warning">!</span><small>검토 대기</small><strong th:text="${stats.pending}">0</strong></article>
        <article><span class="stat-icon info">↻</span><small>검토 중</small><strong th:text="${stats.reviewing}">0</strong></article>
        <article><span class="stat-icon success">✓</span><small>승인 완료</small><strong th:text="${stats.approved}">0</strong></article>
        <article><span class="stat-icon danger">×</span><small>반려됨</small><strong th:text="${stats.rejected}">0</strong></article>
      </section>
      <form class="filter-bar" method="get" action="/admin/hazards">
        <label class="search-field"><span class="sr-only">검색</span><input name="keyword" th:value="${keyword}" placeholder="위험지역, 위치, 제보자 검색"></label>
        <select name="hazardType" aria-label="위험 유형">
          <option value="">전체 유형</option><option value="ROCKFALL" th:selected="${hazardType == 'ROCKFALL'}">낙석</option><option value="STEEP_SLOPE" th:selected="${hazardType == 'STEEP_SLOPE'}">급경사</option><option value="ROAD_DAMAGE" th:selected="${hazardType == 'ROAD_DAMAGE'}">노면 파손</option><option value="VEHICLE_TRAFFIC" th:selected="${hazardType == 'VEHICLE_TRAFFIC'}">차량 통행</option><option value="CONSTRUCTION" th:selected="${hazardType == 'CONSTRUCTION'}">공사 중</option><option value="BLOCKED" th:selected="${hazardType == 'BLOCKED'}">길 막힘</option><option value="OTHER" th:selected="${hazardType == 'OTHER'}">기타</option>
        </select>
        <select name="status" aria-label="상태"><option value="">전체 상태</option><option value="PENDING" th:selected="${status == 'PENDING'}">검토 대기</option><option value="REVIEWING" th:selected="${status == 'REVIEWING'}">검토 중</option><option value="APPROVED" th:selected="${status == 'APPROVED'}">승인 완료</option><option value="REJECTED" th:selected="${status == 'REJECTED'}">반려됨</option><option value="INACTIVE" th:selected="${status == 'INACTIVE'}">비활성</option></select>
        <input type="date" name="dateFrom" th:value="${dateFrom}" aria-label="등록일 시작">
        <input type="date" name="dateTo" th:value="${dateTo}" aria-label="등록일 종료">
        <select name="reported" aria-label="신고 누적 여부"><option value="">신고 전체</option><option value="yes" th:selected="${reported == 'yes'}">신고 있음</option><option value="no" th:selected="${reported == 'no'}">신고 없음</option></select>
        <select name="sort" aria-label="정렬"><option value="newest" th:selected="${sort == 'newest'}">최신순</option><option value="oldest" th:selected="${sort == 'oldest'}">오래된순</option></select>
        <button class="primary-button compact" type="submit">조회</button>
      </form>
      <div class="hazard-workspace">
        <section class="content-panel list-panel">
          <div class="table-scroll">
            <table class="hazard-table">
              <thead><tr><th>상태</th><th>유형</th><th>제목</th><th>위치</th><th>제보자</th><th>신고</th><th>확인</th></tr></thead>
              <tbody>
                <tr th:each="hazard : ${hazards}" th:onclick="|location.href='/admin/hazards/${hazard.id}'|">
                  <td><span class="status-badge" th:classappend="|status-${#strings.toLowerCase(hazard.status)}|" th:text="${hazard.statusLabel}">대기</span></td>
                  <td th:text="${hazard.hazardTypeLabel}">기타</td><td class="title-cell" th:text="${hazard.title}">제목</td><td th:text="${hazard.address}">위치</td><td th:text="${hazard.reporter}">제보자</td><td th:text="${hazard.reportCount}">0</td><td th:text="${hazard.confirmCount}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(hazards)}"><td class="empty-cell" colspan="7">조건에 맞는 위험지역이 없습니다.</td></tr>
              </tbody>
            </table>
          </div>
        </section>
        <section class="map-panel" th:with="first=${#lists.isEmpty(hazards) ? null : hazards[0]}">
          <div id="hazard-map" class="hazard-map" th:attr="data-lat=${first != null ? first.latitude : ''},data-lng=${first != null ? first.longitude : ''}">
            <div class="map-fallback"><span class="map-marker">!</span><p>지도 키를 설정하면 실제 위치가 표시됩니다.</p></div>
            <span class="hazard-marker-data" th:each="hazard : ${hazards}"
                  th:attr="data-lat=${hazard.latitude},data-lng=${hazard.longitude},data-title=${hazard.title},data-type=${hazard.hazardType}"></span>
          </div>
          <div class="map-legend"><span>낙석</span><span>급경사</span><span>노면 파손</span><span>차량 통행</span><span>공사 중</span></div>
        </section>
      </div>
    </main>
  </div>
  <script src="/admin/js/admin.js"></script>
</body></html>
