<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 | TrailGO</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-intro">
      <div class="login-brand"><span class="admin-brand-mark"></span><strong>Trail<span>GO</span></strong></div>
      <p>위험지역 제보를 확인하고 더 안전한 트레일을 관리합니다.</p>
    </section>
    <section class="login-form-panel">
      <h1>관리자 로그인</h1>
      <p>설정된 관리자 계정으로 로그인하세요.</p>
      <form th:action="@{/login}" method="post">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="form-error" th:if="${param.error}">아이디 또는 비밀번호를 확인해주세요.</p>
        <button class="primary-button" type="submit">로그인</button>
      </form>
      <a class="back-link" href="/">TrailGO 홈으로</a>
    </section>
  </main>
</body>
</html>
